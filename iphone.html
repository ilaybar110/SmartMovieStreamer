<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>הקולנוע הביתי</title>
<style>
  :root {
    --bg: #141414;
    --bg-gradient-top: #1f1f1f;
    --card-bg: #1c1c1c;
    --accent: #e50914;
    --accent-dark: #a10812;
    --gold: #f5c518;
    --text: #ffffff;
    --text-dim: #b3b3b3;
    --success: #2ecc71;
    --danger: #e50914;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at top, var(--bg-gradient-top) 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    direction: rtl;
    text-align: center;
    min-height: 100vh;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 16px 70px 16px;
  }

  .header {
    position: relative;
    padding: 34px 20px 30px 20px;
    margin-bottom: 30px;
    border-radius: 28px;
    background:
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%),
      linear-gradient(135deg, #2b0a0a 0%, #4a0e0e 45%, #1a1a1a 100%);
    border: 1px solid rgba(245, 197, 24, 0.35);
    box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 0 40px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .header::before,
  .header::after {
    content: "★";
    position: absolute;
    top: 16px;
    color: var(--gold);
    font-size: 1.1em;
    opacity: 0.7;
  }

  .header::before { right: 22px; }
  .header::after { left: 22px; }

  .brand-icon {
    font-size: 2.4em;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.5));
  }

  h1.main-title {
    font-size: 2.6em;
    font-weight: 900;
    color: var(--text);
    margin: 0;
    line-height: 1.25;
    letter-spacing: 1px;
    text-shadow: 0 3px 14px rgba(0,0,0,0.6);
  }

  .title-underline {
    width: 90px;
    height: 4px;
    background: var(--gold);
    margin: 14px auto 0 auto;
    border-radius: 4px;
  }

  .cast-bar {
    background: linear-gradient(145deg, #232323, #171717);
    border: 3px solid var(--gold);
    border-radius: 26px;
    padding: 22px;
    margin-bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .cast-bar-label {
    font-size: 1.6em;
    font-weight: bold;
    color: var(--gold);
  }

  .airplay-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: rgba(245,197,24,0.12);
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--gold);
  }

  .airplay-btn svg {
    width: 46px;
    height: 46px;
    fill: var(--gold);
  }

  #castStatus {
    font-size: 1.4em;
    font-weight: bold;
    padding: 12px 16px;
    border-radius: 16px;
    width: 100%;
  }

  #castStatus.disconnected {
    background-color: var(--danger);
    color: white;
  }

  #castStatus.connected {
    background-color: var(--success);
    color: #003300;
  }

  .instructions {
    background-color: var(--card-bg);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 34px;
    font-size: 1.35em;
    line-height: 1.9;
    text-align: right;
    border: 1px solid #2a2a2a;
  }

  .instructions p {
    margin: 10px 0;
  }

  .movies-title {
    font-size: 1.9em;
    font-weight: 900;
    margin: 10px 0 22px 0;
    color: var(--text);
    text-align: right;
    border-right: 8px solid var(--accent);
    padding-right: 14px;
  }

  .movie-list {
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  .movie-card {
    position: relative;
    width: 100%;
    border: none;
    border-radius: 26px;
    cursor: pointer;
    padding: 0;
    overflow: hidden;
    background-color: var(--card-bg);
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
    transition: transform 0.08s ease-in-out;
    text-align: right;
  }

  .movie-card:active {
    transform: scale(0.97);
  }

  .poster {
    width: 100%;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .poster-1 {
    background: linear-gradient(135deg, #3a1c1c 0%, #6b1b1b 45%, #b8860b 100%);
  }

  .poster-2 {
    background: linear-gradient(135deg, #1c2a3a 0%, #1b3a5c 45%, #0f6b5c 100%);
  }

  .poster-3 {
    background: linear-gradient(135deg, #2a1c3a 0%, #4a1b5c 45%, #6b0f4a 100%);
  }

  .poster-emoji {
    font-size: 5.5em;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }

  .play-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 86px;
    height: 86px;
    background: rgba(0,0,0,0.55);
    border: 3px solid var(--text);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4em;
    color: var(--text);
    padding-right: 6px;
  }

  .card-info {
    padding: 18px 22px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-title {
    font-size: 1.8em;
    font-weight: 900;
    color: var(--text);
  }

  .card-sub {
    font-size: 1.1em;
    color: var(--text-dim);
  }

  .watch-btn {
    margin-top: 10px;
    background-color: var(--accent);
    color: white;
    font-size: 1.3em;
    font-weight: 900;
    border: none;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 6px 0 var(--accent-dark);
  }

  #player {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 30px;
    background: #000;
    display: none;
  }

  #player.visible {
    display: block;
  }

  footer {
    margin-top: 46px;
    font-size: 1.1em;
    color: #777;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="brand-icon">🎬</span>
    <h1 class="main-title">הקולנוע הביתי</h1>

<script>
  const player = document.getElementById('player');
  const statusEl = document.getElementById('castStatus');
  const airplayBtn = document.getElementById('airplayBtn');

  function updateStatusUI(isConnected) {
    if (isConnected) {
      statusEl.textContent = 'מחובר לטלוויזיה!';
      statusEl.classList.remove('disconnected');
      statusEl.classList.add('connected');
    } else {
      statusEl.textContent = 'לא מחובר לטלוויזיה';
      statusEl.classList.remove('connected');
      statusEl.classList.add('disconnected');
    }
  }

  // Listen for AirPlay connect/disconnect events (WebKit only)
  if (window.WebKitPlaybackTargetAvailabilityEvent) {
    player.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', function() {
      updateStatusUI(player.webkitCurrentPlaybackTargetIsWireless);
    });
  }

  airplayBtn.addEventListener('click', function() {
    if (player.webkitShowPlaybackTargetPicker) {
      player.webkitShowPlaybackTargetPicker();
    } else {
      alert('AirPlay אינו זמין בדפדפן זה. יש לפתוח את הדף בדפדפן Safari.');
    }
  });

  function playMovie(videoUrl, title) {
    if (videoUrl.indexOf('ARCHIVE_ORG_URL_HERE') === 0) {
      alert('הסרט הזה עדיין לא מוכן.');
      return;
    }
    player.src = videoUrl;
    player.classList.add('visible');
    player.setAttribute('title', title);
    player.play().catch(function() {});
    player.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>
